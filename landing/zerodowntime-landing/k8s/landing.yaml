apiVersion: v1
kind: Namespace
metadata: {name: landing}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: landing, namespace: landing}
spec:
  replicas: 2
  selector: {matchLabels: {app: landing}}
  template:
    metadata: {labels: {app: landing}}
    spec:
      # imagePullSecrets: [{name: nexus-regcred}]   # uncomment for the private Nexus registry
      containers:
        - name: landing
          image: NEXUS_HOST:PORT/zerodowntime/landing:1.0.0   # <- change
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata: {name: landing, namespace: landing}
spec:
  type: NodePort
  selector: {app: landing}
  ports: [{port: 80, targetPort: 8080, nodePort: 30081}]
