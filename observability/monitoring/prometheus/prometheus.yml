global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: kubernetes-nodes
    static_configs:
      - targets:
          - 10.10.20.11:9100
        labels:
          node: controller

      - targets:
          - 10.10.10.11:9100
        labels:
          node: worker1

      - targets:
          - 10.10.10.12:9100
        labels:
          node: worker2
  - job_name: kubernetes-state
    scrape_interval: 30s
    static_configs:
      - targets:
          - 10.10.20.11:30080
        labels:
          cluster: taskflow
  - job_name: kubernetes-cadvisor
    scrape_interval: 30s
    scheme: https
    metrics_path: /metrics/cadvisor

    kubernetes_sd_configs:
      - role: node
        api_server: https://10.10.20.11:6443
        bearer_token_file: /etc/prometheus/secrets/kubernetes.token
        tls_config:
          ca_file: /etc/prometheus/secrets/kubernetes-ca.crt

    bearer_token_file: /etc/prometheus/secrets/kubernetes.token
    tls_config:
      ca_file: /etc/prometheus/secrets/kubernetes-ca.crt

    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node

      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - target_label: __address__
        replacement: 10.10.20.11:6443

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
